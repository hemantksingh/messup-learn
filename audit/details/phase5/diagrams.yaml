- file: circuit-breaker-states.drawio
  page: platform/Resilience Patterns.md
  replaces: null
  after_heading: "## Circuit breakers"
  alt: "State machine of a circuit breaker with three states. Closed is normal, calls go through and outcomes are counted; when failures cross the threshold it moves to Open, where calls fail without touching the dependency; after a cool-off it moves to Half-open and lets one probe through; if the probe succeeds it returns to Closed, if the probe fails it returns to Open. Caption: a timeout bounds one call; a breaker stops calling."
  title: "Circuit breaker states"

