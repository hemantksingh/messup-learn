  alt: "Two columns of network layers. The OSI model's seven layers (application, presentation, session, transport, network, data link, physical) on the left; the TCP/IP model's four layers on the right, with application spanning the top three OSI layers, transport and internet matching one OSI layer each, and network access spanning data link and physical. Each TCP/IP layer lists its protocol data unit (data; segment or datagram; packet; frame) and example protocols (HTTP, TLS, SSH, SMTP; TCP, UDP; IP, ICMP; Ethernet, Wi-Fi). A caption says this wiki uses the four-layer model and counts TLS and SSH as application layer."
