- file: vm-vs-container.drawio
  page: platform/Containers.md
  replaces: null
  after_heading: "## VM versus container"
  alt: "Two stacks side by side. Left, virtual machines: hardware at the bottom, a hypervisor above it, and two dashed VM (guest) boxes each holding its own guest kernel and an app. Right, containers: the same hardware, one host kernel shared by every container, and two dashed boxes labelled namespaces + cgroup each holding an app that is just a process, with a note that there is no second kernel and no virtual hardware. Caption: the kernel is the trust boundary difference."
  title: "VM versus container: where the kernel sits"

- file: image-layers-overlay2.drawio
  page: platform/Containers.md
  replaces: null
  after_heading: "## Images and containers"
  alt: "A stack of three wide read-only image layers, base image at the bottom, then dependencies, then app (source). On top sit two thin writable layers side by side, one for container A and one for container B, both sharing the same lower layers. Container A's process writes and the written file lands in its writable layer; its read falls through the layers to the base image. Container B's process deletes a file and a red marker in its writable layer hides the lower file while the bytes stay below. Caption: two containers from one image share its read-only layers on disk; only their writable layers differ."
  title: "Image layers and the writable container layer (overlay2)"

- file: container-runtime-stack.drawio
  page: platform/Containers.md
  replaces: null
  after_heading: "## The runtime stack"
  alt: "Two paths to the same runtime. Bottom row: docker CLI talks to dockerd over a socket, dockerd hands the container to containerd, containerd calls runc across the OCI runtime spec boundary, and runc creates the namespaces and cgroup and execs the process. Top row: kubelet talks to CRI (Container Runtime Interface), which joins at containerd or goes to CRI-O; CRI-O also calls runc across the OCI runtime spec. Between the rows an OCI image from the registry feeds both containerd and CRI-O across the OCI image spec boundary. Caption: Kubernetes dropped Docker (dockershim removed in 1.24) and Docker-built images still run because they are OCI images."
  title: "The container runtime stack and the OCI boundaries"

- file: supply-chain-path.drawio
  page: security/Supply Chain and Container Security.md
  replaces: null
  after_line_containing: "Both are described under"
  alt: "Six hops left to right from commit to running process: Source, Dependencies, Build, Registry, Admission, Running container. Under each hop its tamper point in red: code swapped or added at the commit; a vulnerable dependency (Log4Shell); a tampered build (SolarWinds); a tag moved to another image; an image not from the registry or not signed; a privileged container or a kernel bug as a way out. Above each hop the control that closes it in green: reviewed changes; base image pinned by digest and scanning in CI; SLSA provenance with the pipeline protected like production; signature and SBOM stored next to the image with rescans when a new CVE lands; an admission controller allowing only the private registry and a pinned signer identity; non-root, dropped capabilities and a seccomp profile with a gVisor, Kata or Firecracker boundary."
  title: "The supply chain path: hops, tamper points and controls"

- file: eks-pod-addressing.drawio
  page: cloud/aws/EKS.md
  replaces: null
  after_heading: "## Pod networking with the VPC CNI"
  alt: "One worker node (an EC2 instance) drawn as a dashed box. Its primary ENI takes one address, 10.0.1.10, from the node subnet 10.0.1.0/24 in the VPC's primary CIDR. Two secondary ENIs sit in the pod subnet 100.64.1.0/24, which comes from the VPC's secondary CIDR 100.64.0.0/10; each ENI slot is delegated one /28 prefix of 16 addresses (100.64.1.16/28 and 100.64.1.32/28) and pods hang off addresses inside it, for example 100.64.1.17, .18 and .19, with the rest of the prefix as a warm pool. The node keeps its address in the original subnet; only the pod ENIs move to the secondary range. Addresses are examples."
  title: "Where an EKS pod address comes from: secondary CIDR and prefix delegation"

- file: data-pipeline-stages.drawio
  page: data/Data Pipelines.md
  replaces: null
  after_line_containing: "Capture, curate, consume is the same list"
  alt: "Four stage boxes left to right: Capture (ingest), Store (object storage, raw table), Transform (filter, join, clean, aggregate) and Serve (query engine, dashboard, model). A source database feeds Capture through an arrow labelled CDC: read the change log, from its write-ahead log or binlog. The row itself is the batch path, with the Store to Transform arrow labelled batch: scheduled DAG over stored data. A second arrow runs beneath from Capture straight to Transform labelled stream: each event as it arrives, windows over an unbounded input. Caption: batch input is fixed when the job starts so a failed job is rerun; a stream never finishes so it is cut into windows with event time, processing time, a watermark and a late-data rule."
  title: "Pipeline stages with the batch and stream paths"
