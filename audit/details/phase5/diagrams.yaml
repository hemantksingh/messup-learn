  replaces: "http-stacks.PNG"
  after_line_containing: "a new transport would have taken decades to deploy"
  alt: "Three protocol stacks side by side. HTTP/1.1 over optional TLS over TCP over IP, using several TCP connections. HTTP/2 over TLS (effectively required) over TCP over IP, using one TCP connection with many streams. HTTP/3 over QUIC with TLS 1.3 built in, over UDP over IP, using one QUIC connection with independent streams."
  title: "HTTP protocol stacks"
- file: "http-multiplexing.drawio"
  page: "web and apis/HTTP.md"
  replaces: "http-v-http2.jpg"
  after_line_containing: "because a loss on one of the six stalls only that one"
  alt: "Three client-to-server timelines. HTTP/1.1 sends one request and waits for its response before sending the next, so the next request waits behind the previous response (head-of-line blocking). HTTP/2 sends several requests on one TCP connection and the response frames of different streams interleave, but one lost TCP packet stalls all streams. HTTP/3 does the same over independent QUIC streams, so one lost packet stalls only its own stream."
  title: "Multiplexing in HTTP/1.1, HTTP/2 and HTTP/3"
