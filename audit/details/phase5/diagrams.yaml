- file: "password-hashing.drawio"
  page: "security/Cryptography Basics.md"
  replaces: "password-hashing.png"
  after_line_containing: "PBKDF2-HMAC-SHA256 with 600,000 iterations"
  alt: "Two panels. Creation: the password and a random salt, unique per password, go into Argon2id, a slow memory-hard hash; the resulting hash is stored and the salt is stored next to it. Verification: the entered password and the stored salt go into the same Argon2id hash and the result is compared with the stored hash"
  title: "Password hashing with a per-password salt"

- file: "digital-signature.drawio"
  page: "security/Cryptography Basics.md"
  replaces: null
  after_heading: "## Digital signatures"
  alt: "Two panels side by side. MAC: the sender computes a tag over the message with a shared key and sends message plus tag; the receiver recomputes the tag with the same key and compares; both parties hold the key, so either side could have made the tag and there is no non-repudiation. Digital signature: the sender hashes the message and signs the digest with the private key, which never leaves its owner, and sends message plus signature; the receiver verifies with the published public key; only the key holder could have made it, so a third party can check and non-repudiation holds"
  title: "MAC versus digital signature"

