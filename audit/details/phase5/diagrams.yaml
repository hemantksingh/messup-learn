  page: networking/TLS.md
  replaces: null
  after_heading: "## The handshake, rederived for TLS 1.3"
  alt: "Sequence diagram of the TLS 1.3 handshake between a client and a server: the client sends ClientHello with its versions, cipher suites, ephemeral key share and SNI; the server replies with ServerHello carrying its key share plus the encrypted Certificate, CertificateVerify (a signature over the transcript with the certificate's private key) and Finished; both sides derive session keys from the shared secret and the transcript; the client sends its Finished and application data flows in both directions"
  title: "TLS 1.3 handshake"
