- file: "persisted-background-jobs.drawio"
  page: "messaging/Messaging Fundamentals.md"
  replaces: null
  after_heading: "## Persisted background jobs"
  alt: "A web application serialises the call and writes it as a job to a persisted job store, a database such as SQL Server or Redis. A worker dequeues, runs and retries the job; it is drawn twice, dashed inside the web process and solid in a separate worker process, because where it runs is a hosting choice. If the process dies the job is still in the store; the store is a queue and the worker a consumer, so a job may run twice and must be idempotent"
  title: "Persisted background jobs"

