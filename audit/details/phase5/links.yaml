# Phase 5 dead-link fix list for messup-learn
# Generated 2026-09-16 from audit/tools/linkcheck-one.sh over computing networking "web and apis" data messaging security platform cloud practice
# 345 unique URLs checked: 257 OK, 36 MOVED, 9 DEAD, 8 ERR, 28 UNVERIFIED (403/429/5xx), 7 PLACEHOLDER
# `old` is the exact in-file string (the checker truncates at "(" / ")"; the manifest does not).
# Match on file + `old`, not on `line`: pages were being edited while this ran and line numbers drifted
# (they were recomputed against the working tree at the time of writing, but may drift again).
# `verified` is the HTTP status curl returned for `new`; 403 means the host blocks curl and the page was confirmed another way (see note).
# For `remove` entries (new: null) `verified` is the status of `old` (404 / ERR, or 200 when the redirect lands on an unrelated page).
# section: dead     = 404/410
#          err      = no response
#          landing  = redirect lands on a generic product/marketing page
#          cleanup  = version pin, tracking parameter or session token worth stripping (page not broken)
#          optional = redirect works; cosmetic move to the canonical URL

